# Jarvis: bygger appen på en macOS-maskine hos GitHub, så Lauritz kan hente
# en færdig .app uden selv at have Xcode.
#
# Ingen hemmeligheder, ingen certifikater: appen signeres "ad hoc" (CODE_SIGN_IDENTITY="-"),
# præcis som projektets egen indstilling CODE_SIGN_IDENTITY[sdk=macosx*] = "-" allerede siger.
# macOS advarer første gang mod en ad hoc-signeret app — se JARVIS-OPSKRIFT.md.
#
# Resultatet ligger tre steder:
#   1. Releases       -> en udgivelse pr. grønt byg, så https://github.com/<repo>/releases/latest
#                        altid er et almindeligt downloadlink (zip + dmg, ligger for altid)
#   2. Actions-fanen  -> artifact «boringNotch-jarvis-<sha7>» (zip + dmg, 30 dage)
#   3. Grenen «build-logs» -> build-logs/latest.md, så huset kan læse fejlene uden GitHub-adgang

name: "Jarvis: byg appen"

on:
  push:
    branches: [jarvis]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jarvis-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  byg:
    name: Byg boringNotch med Jarvis-fanen
    runs-on: macos-15
    env:
      PROJECT_NAME: boringNotch
      # Projektet er lavet med Xcode 16.4 (LastUpgradeCheck = 1640); findes den ikke
      # på maskinen, tages den nyeste Xcode der er.
      XCODE_VERSION: "16.4"
      # Alle Mac'er med notch er Apple Silicon, så vi bygger kun arm64.
      # Skal appen også kunne køre på en Intel-Mac: skriv «arm64 x86_64».
      ARKITEKTURER: "arm64"

    steps:
      - name: Hent koden
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Hele historikken og alle tags: udgivelsens «hvad er nyt» er commit-beskederne
          # siden forrige release-tag, og dem kan man ikke se i en overfladisk klon.
          fetch-depth: 0

      - name: Kort sha
        id: sha
        run: echo "kort=$(echo "$GITHUB_SHA" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Vælg Xcode
        run: |
          set -uo pipefail
          XCODE_PATH="/Applications/Xcode_${XCODE_VERSION}.app"
          if [ ! -d "$XCODE_PATH" ]; then
            echo "Xcode ${XCODE_VERSION} findes ikke. Til rådighed:"
            ls -d /Applications/Xcode*.app 2>/dev/null || true
            XCODE_PATH="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)"
          fi
          echo "Bruger $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version

      - name: Byg (ad hoc-signeret, Release)
        id: byg
        continue-on-error: true
        run: |
          set -uo pipefail
          LOG="$RUNNER_TEMP/build.log"
          DD="$RUNNER_TEMP/dd"
          {
            echo "== xcodebuild -version =="
            xcodebuild -version
            echo
            echo "== projektets skemaer =="
          } > "$LOG" 2>&1
          xcodebuild -list -project "${PROJECT_NAME}.xcodeproj" >> "$LOG" 2>&1 || true
          echo "== henter Swift-pakker ==" >> "$LOG"
          xcodebuild -resolvePackageDependencies -project "${PROJECT_NAME}.xcodeproj" >> "$LOG" 2>&1 || true
          echo "== bygger ==" >> "$LOG"

          byg_med() {
            xcodebuild build "$@" \
              -project "${PROJECT_NAME}.xcodeproj" \
              -configuration Release \
              -derivedDataPath "$DD" \
              ARCHS="$ARKITEKTURER" \
              ONLY_ACTIVE_ARCH=NO \
              CODE_SIGN_STYLE=Manual \
              CODE_SIGN_IDENTITY="-" \
              CODE_SIGNING_REQUIRED=YES \
              CODE_SIGNING_ALLOWED=YES \
              DEVELOPMENT_TEAM="" \
              PROVISIONING_PROFILE_SPECIFIER="" >> "$LOG" 2>&1
          }

          byg_med -scheme "${PROJECT_NAME}" -destination "generic/platform=macOS"
          STATUS=$?

          # Findes skemaet ikke (det er ikke delt i projektet), så byg målet direkte.
          if [ "$STATUS" -ne 0 ] && grep -q "does not contain a scheme" "$LOG"; then
            echo "== skemaet fandtes ikke, bygger målet direkte ==" >> "$LOG"
            byg_med -target "${PROJECT_NAME}" -sdk macosx
            STATUS=$?
          fi

          echo "BYG_STATUS=$STATUS" >> "$GITHUB_ENV"
          echo "--- sidste 60 linjer ---"
          tail -n 60 "$LOG"
          exit $STATUS

      - name: Pak appen (zip og dmg)
        if: always()
        run: |
          set -uo pipefail
          exec > >(tee "$RUNNER_TEMP/pak.log") 2>&1
          APP="$RUNNER_TEMP/dd/Build/Products/Release/${PROJECT_NAME}.app"
          NAVN="${PROJECT_NAME}-jarvis-${{ steps.sha.outputs.kort }}"
          if [ ! -d "$APP" ]; then
            echo "Ingen app at pakke (bygget fejlede)."
            echo "HAR_APP=nej" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "HAR_APP=ja" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/ud"

          echo "== signaturen =="
          codesign -dv --verbose=2 "$APP" 2>&1 | tail -n 20 || true

          # ditto, ikke zip: signaturen og symlinks skal med
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$RUNNER_TEMP/ud/${NAVN}.zip"

          # dmg med husets eget script — det kræver ingen certifikater
          VENV="$RUNNER_TEMP/venv"
          python3 -m venv "$VENV"
          # shellcheck disable=SC1091
          source "$VENV/bin/activate"
          python3 -m pip install --quiet --upgrade pip setuptools wheel || true
          if python3 -m pip install --quiet --require-hashes -r Configuration/dmg/requirements.txt; then
            chmod +x Configuration/dmg/create_dmg.sh
            ./Configuration/dmg/create_dmg.sh "$APP" "$RUNNER_TEMP/ud/${NAVN}.dmg" "boringNotch Jarvis" \
              || echo "dmg'en fejlede — der er stadig en zip."
          else
            echo "dmgbuild kunne ikke installeres — der er stadig en zip."
          fi
          ls -la "$RUNNER_TEMP/ud"

      - name: Læg appen op som artifact
        if: always() && env.HAR_APP == 'ja'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: boringNotch-jarvis-${{ steps.sha.outputs.kort }}
          path: ${{ runner.temp }}/ud/*
          retention-days: 30
          if-no-files-found: warn

      - name: Læg byggeloggen op som artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: byggelog-${{ steps.sha.outputs.kort }}
          path: ${{ runner.temp }}/build.log
          retention-days: 30
          if-no-files-found: warn

      # Et almindeligt downloadlink til Lauritz. Hvert GRØNT byg på grenen bliver en
      # GitHub Release, så .../releases/latest altid peger på den nyeste app med Jarvis-fanen.
      # Rødt byg = ingen release. Mislykkedes dmg'en, udgives zip'en alligevel, og
      # udgivelsesteksten siger at dmg'en mangler.
      - name: Udgiv en Release (kun når bygget er grønt)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KORT: ${{ steps.sha.outputs.kort }}
        run: |
          set -uo pipefail
          exec > >(tee "$RUNNER_TEMP/release.log") 2>&1

          if [ "${BYG_STATUS:-1}" != "0" ] || [ "${HAR_APP:-nej}" != "ja" ]; then
            echo "Bygget var ikke grønt — ingen udgivelse denne gang."
            exit 0
          fi

          UD="$RUNNER_TEMP/ud"
          NAVN="${PROJECT_NAME}-jarvis-${KORT}"
          ZIP="$UD/${NAVN}.zip"
          DMG="$UD/${NAVN}.dmg"

          TAG="jarvis-v$(date -u +%Y%m%d)-${KORT}"
          DATO="$(date -u '+%-d/%-m-%Y')"

          # Kørte samme commit igen samme dag, så findes tagget allerede: ryd det væk først,
          # så udgivelsen bliver skrevet forfra i stedet for at fejle.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Udgivelsen $TAG fandtes i forvejen — den erstattes."
            gh release delete "$TAG" --yes --cleanup-tag || true
          fi

          FORRIGE="$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)"
          NYT="$RUNNER_TEMP/nyt.txt"
          if [ -n "$FORRIGE" ] && git rev-parse -q --verify "refs/tags/${FORRIGE}" >/dev/null; then
            git log --no-merges --format='- %s' "refs/tags/${FORRIGE}..HEAD" \
              | sed 's/ *\[skip ci\]//' | head -n 30 > "$NYT"
          else
            git log --no-merges --format='- %s' -n 10 | sed 's/ *\[skip ci\]//' > "$NYT"
          fi
          [ -s "$NYT" ] || echo "- (ingen nye commits siden sidste udgivelse)" > "$NYT"

          VEDHAEFT=""
          [ -f "$ZIP" ] && VEDHAEFT="$VEDHAEFT $ZIP"
          if [ -f "$DMG" ]; then
            VEDHAEFT="$VEDHAEFT $DMG"
            DMG_LINJE="- **${NAVN}.dmg** — dobbeltklik og træk **boringNotch** over i **Programmer**."
          else
            DMG_LINJE="- **dmg'en mangler denne gang** (pakningen fejlede på byggemaskinen) — brug zip'en."
          fi

          BODY="$RUNNER_TEMP/body.md"
          {
            echo "boringNotch med Jarvis-fanen, bygget hos GitHub på en Mac."
            echo
            echo "- dato: ${DATO}"
            echo "- commit: \`${GITHUB_SHA}\`"
            echo "- gren: ${GITHUB_REF_NAME}"
            echo "- kørsel: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "## Hent"
            echo
            echo "$DMG_LINJE"
            echo "- **${NAVN}.zip** — pak ud og træk **boringNotch.app** til **/Programmer**. Virker altid."
            echo
            echo "**Første gang advarer macOS**, fordi appen er ad hoc-signeret (ingen Apple-udviklerkonto)."
            echo "Højreklik på appen → **Åbn** → **Åbn**, eller i Terminal:"
            echo
            echo '```bash'
            echo "xattr -dr com.apple.quarantine /Applications/boringNotch.app"
            echo '```'
            echo
            echo "Resten af trinnene (tilladelser, login, Jarvis-adressen) står i \`JARVIS-OPSKRIFT.md\`."
            echo
            echo "## Hvad er nyt"
            echo
            cat "$NYT"
          } > "$BODY"

          # shellcheck disable=SC2086
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "boringNotch med Jarvis — ${DATO}" \
            --notes-file "$BODY" \
            --latest \
            $VEDHAEFT

          echo "UDGIVELSE=$TAG" >> "$GITHUB_ENV"
          echo
          echo "== udgivelsen $TAG =="
          echo "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          echo "== vedhæftede filer =="
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name)  \(.size) bytes"'

      # Byggeloggen tilbage i repoet, så huset (uden GitHub-adgang) kan læse den med
      #   git fetch origin build-logs && git show origin/build-logs:build-logs/latest.md
      - name: Skriv byggeloggen til grenen build-logs
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KORT: ${{ steps.sha.outputs.kort }}
        run: |
          set -uo pipefail
          LOG="$RUNNER_TEMP/build.log"
          [ -f "$LOG" ] || echo "(ingen byggelog — jobbet nåede ikke at bygge)" > "$LOG"

          if [ "${BYG_STATUS:-1}" = "0" ]; then
            STATUS="GRØN — appen blev bygget"
          else
            STATUS="RØD — bygget fejlede (exit ${BYG_STATUS:-ukendt})"
          fi
          if [ "${HAR_APP:-nej}" = "ja" ]; then
            ARTIFACT="boringNotch-jarvis-${KORT} (zip, og dmg hvis den lykkedes)"
          else
            ARTIFACT="ingen — der kom ingen .app ud af bygget"
          fi
          if [ -n "${UDGIVELSE:-}" ]; then
            RELEASE="${UDGIVELSE} — ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${UDGIVELSE}"
          else
            RELEASE="ingen — der udgives kun ved grønt byg"
          fi

          MD="$RUNNER_TEMP/latest.md"
          {
            echo "# Seneste byg — $STATUS"
            echo
            echo "- dato: $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "- gren: ${GITHUB_REF_NAME}"
            echo "- sha: ${GITHUB_SHA}"
            echo "- kørsel: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- artifact: $ARTIFACT"
            echo "- udgivelse: $RELEASE"
            echo
            echo '## Fejl og advarsler (de første 200 linjer)'
            echo
            echo '```'
            grep -E "(error|warning):" "$LOG" | head -n 200 || true
            echo '```'
            echo
            echo '## Pakningen (zip og dmg)'
            echo
            echo '```'
            if [ -f "$RUNNER_TEMP/pak.log" ]; then tail -n 40 "$RUNNER_TEMP/pak.log"; else echo "(pakningen nåede ikke at køre)"; fi
            echo '```'
            echo
            echo '## Udgivelsen (Release) og de vedhæftede filer'
            echo
            echo '```'
            if [ -f "$RUNNER_TEMP/release.log" ]; then cat "$RUNNER_TEMP/release.log"; else echo "(udgivelsen nåede ikke at køre)"; fi
            echo '```'
            echo
            echo '## Slutningen af loggen (sidste 80 linjer)'
            echo
            echo '```'
            tail -n 80 "$LOG"
            echo '```'
          } > "$MD"

          WORK="$RUNNER_TEMP/logrepo"
          rm -rf "$WORK"; mkdir -p "$WORK"; cd "$WORK"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin build-logs 2>/dev/null; then
            git checkout -q -B build-logs FETCH_HEAD
          else
            git checkout -q -B build-logs
          fi
          mkdir -p build-logs
          cp "$MD" build-logs/latest.md
          { grep -E "error:" "$LOG" || echo "(ingen error:-linjer)"; } > build-logs/fejl.txt
          tail -n 1500 "$LOG" > build-logs/byggelog-hale.txt
          git add -A build-logs
          git commit -q -m "Byggelog ${KORT}: ${STATUS}" || echo "(intet nyt at skrive)"
          git push -q origin build-logs
          echo "Byggeloggen står nu på grenen build-logs."
