# Jarvis: bygger appen på en macOS-maskine hos GitHub, så Lauritz kan hente
# en færdig .app uden selv at have Xcode.
#
# Ingen hemmeligheder, ingen certifikater: appen signeres "ad hoc" (CODE_SIGN_IDENTITY="-"),
# præcis som projektets egen indstilling CODE_SIGN_IDENTITY[sdk=macosx*] = "-" allerede siger.
# macOS advarer første gang mod en ad hoc-signeret app — se JARVIS-OPSKRIFT.md.
#
# Resultatet ligger tre steder:
#   1. Releases       -> en udgivelse pr. grønt byg, så https://github.com/<repo>/releases/latest
#                        altid er et almindeligt downloadlink (zip + dmg, ligger for altid)
#   2. Actions-fanen  -> artifact «boringNotch-jarvis-<sha7>» (zip + dmg, 30 dage)
#   3. Grenen «build-logs» -> build-logs/latest.md, så huset kan læse fejlene uden GitHub-adgang

name: "Jarvis: byg appen"

on:
  push:
    branches: [jarvis]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jarvis-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  byg:
    name: Byg boringNotch med Jarvis-fanen
    runs-on: macos-15
    env:
      PROJECT_NAME: boringNotch
      # Projektet er lavet med Xcode 16.4 (LastUpgradeCheck = 1640); findes den ikke
      # på maskinen, tages den nyeste Xcode der er.
      XCODE_VERSION: "16.4"
      # Alle Mac'er med notch er Apple Silicon, så vi bygger kun arm64.
      # Skal appen også kunne køre på en Intel-Mac: skriv «arm64 x86_64».
      ARKITEKTURER: "arm64"

    steps:
      - name: Hent koden
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Hele historikken og alle tags: udgivelsens «hvad er nyt» er commit-beskederne
          # siden forrige release-tag, og dem kan man ikke se i en overfladisk klon.
          fetch-depth: 0

      - name: Kort sha
        id: sha
        run: echo "kort=$(echo "$GITHUB_SHA" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Vælg Xcode
        run: |
          set -uo pipefail
          XCODE_PATH="/Applications/Xcode_${XCODE_VERSION}.app"
          if [ ! -d "$XCODE_PATH" ]; then
            echo "Xcode ${XCODE_VERSION} findes ikke. Til rådighed:"
            ls -d /Applications/Xcode*.app 2>/dev/null || true
            XCODE_PATH="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)"
          fi
          echo "Bruger $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version

      - name: Byg (ad hoc-signeret, Release)
        id: byg
        continue-on-error: true
        run: |
          set -uo pipefail
          LOG="$RUNNER_TEMP/build.log"
          DD="$RUNNER_TEMP/dd"
          {
            echo "== xcodebuild -version =="
            xcodebuild -version
            echo
            echo "== projektets skemaer =="
          } > "$LOG" 2>&1
          xcodebuild -list -project "${PROJECT_NAME}.xcodeproj" >> "$LOG" 2>&1 || true
          echo "== henter Swift-pakker ==" >> "$LOG"
          xcodebuild -resolvePackageDependencies -project "${PROJECT_NAME}.xcodeproj" >> "$LOG" 2>&1 || true
          echo "== bygger ==" >> "$LOG"

          # BUILD-NUMMERET ER DET, DER AFGØR, OM SPARKLE TILBYDER OPDATERINGEN.
          # Projektets faste CURRENT_PROJECT_VERSION = 271 er den samme i hvert
          # eneste byg, og Sparkle sammenligner netop det tal (CFBundleVersion)
          # med det, der står i appcasten: er de ens, siger appen «du er
          # opdateret» for evigt, og «hent ny kode gennem appen» virker aldrig.
          # Antallet af commits på grenen vokser af sig selv ved hver rettelse
          # og er allerede forbi 271 (1281 den 16/9), så det bruger vi.
          # Huset GÆTTER ikke på tallet bagefter — notch_appcast.py læser det ud
          # af den app, der faktisk blev udgivet.
          BUILD_NUMMER="$(git rev-list --count HEAD)"
          echo "== build-nummer (commits på grenen): $BUILD_NUMMER ==" >> "$LOG"

          byg_med() {
            xcodebuild build "$@" \
              -project "${PROJECT_NAME}.xcodeproj" \
              -configuration Release \
              -derivedDataPath "$DD" \
              ARCHS="$ARKITEKTURER" \
              ONLY_ACTIVE_ARCH=NO \
              CURRENT_PROJECT_VERSION="$BUILD_NUMMER" \
              CODE_SIGN_STYLE=Manual \
              CODE_SIGN_IDENTITY="-" \
              CODE_SIGNING_REQUIRED=YES \
              CODE_SIGNING_ALLOWED=YES \
              DEVELOPMENT_TEAM="" \
              PROVISIONING_PROFILE_SPECIFIER="" >> "$LOG" 2>&1
          }

          byg_med -scheme "${PROJECT_NAME}" -destination "generic/platform=macOS"
          STATUS=$?

          # Findes skemaet ikke (det er ikke delt i projektet), så byg målet direkte.
          if [ "$STATUS" -ne 0 ] && grep -q "does not contain a scheme" "$LOG"; then
            echo "== skemaet fandtes ikke, bygger målet direkte ==" >> "$LOG"
            byg_med -target "${PROJECT_NAME}" -sdk macosx
            STATUS=$?
          fi

          echo "BYG_STATUS=$STATUS" >> "$GITHUB_ENV"
          echo "--- sidste 60 linjer ---"
          tail -n 60 "$LOG"
          exit $STATUS

      # Kuren på Lauritz' nedbrud 16/9: dyld nægtede at indlæse
      # MediaRemoteAdapter.framework, fordi appen var ad hoc-signeret (intet team-id),
      # mens det indlejrede framework stadig bar upstreams Developer ID. Med hardened
      # runtime skal appen og alle indlejrede binærer have SAMME team-id, og «ingen»
      # tæller kun som ens, hvis begge er ad hoc. Derfor signeres hele indmaden om her —
      # indefra og ud — i stedet for at slække på library validation.
      # (Omsigneringen er lovlig: MediaRemoteAdapter er BSD-licenseret, se THIRD_PARTY_LICENSES.)
      - name: Signér alle indlejrede dele ad hoc
        id: signering
        if: always()
        continue-on-error: true
        run: |
          set -uo pipefail

          APP="$RUNNER_TEMP/dd/Build/Products/Release/${PROJECT_NAME}.app"
          LOG="$RUNNER_TEMP/signering.log"

          # Dybeste sti først, så en del altid er signeret, før bundtet omkring den forsegles.
          dybest_foerst() { awk -F/ '{print NF"\t"$0}' | sort -rn -k1,1 | cut -f2-; }
          er_macho() { file -b "$1" 2>/dev/null | grep -q "Mach-O"; }
          kort() { if [ "$1" = "$APP" ]; then printf '%s' "${PROJECT_NAME}.app"; else printf '%s' "${1#$APP/}"; fi; }

          hovedet() {
            ENT_DIR="$RUNNER_TEMP/ent"; rm -rf "$ENT_DIR"; mkdir -p "$ENT_DIR"
            TAELLER=0
            FEJL=0
            MED_TEAM=0

            # Signerer ét sted ad hoc og beholder de rettigheder, der allerede står i
            # signaturen (XPC-hjælperen skal fx blive ved med at stå uden for sandkassen).
            signer() {
              STI="$1"
              TAELLER=$((TAELLER + 1))
              ENT="$ENT_DIR/$TAELLER.plist"
              RET="ingen rettigheder"
              set -- --force --sign - --timestamp=none --options runtime
              if codesign -d --entitlements :- "$STI" > "$ENT" 2>/dev/null \
                 && [ -s "$ENT" ] && plutil -lint "$ENT" > /dev/null 2>&1; then
                set -- "$@" --entitlements "$ENT"
                RET="rettigheder beholdt"
              else
                rm -f "$ENT"
              fi
              if codesign "$@" "$STI" 2>&1; then
                echo "   OK   $(kort "$STI")  ($RET)"
              else
                echo "   FEJL $(kort "$STI")  ($RET)"
                FEJL=$((FEJL + 1))
              fi
            }

            echo "== 1. indlejrede binærer, dybeste først =="
            find "$APP" -type f | dybest_foerst > "$RUNNER_TEMP/binaerer.txt"
            while IFS= read -r F; do
              if [ "$F" = "$APP/Contents/MacOS/${PROJECT_NAME}" ]; then continue; fi
              er_macho "$F" || continue
              signer "$F"
            done < "$RUNNER_TEMP/binaerer.txt"

            echo
            echo "== 2. indlejrede bundter, dybeste først =="
            {
              find "$APP" -mindepth 1 \( -name "*.app" -o -name "*.xpc" -o -name "*.appex" \
                   -o -name "*.bundle" -o -name "*.systemextension" \) -type d
              find "$APP" -mindepth 1 -name "*.framework" -type d | while IFS= read -r FW; do
                if [ -d "$FW/Versions" ]; then
                  find "$FW/Versions" -mindepth 1 -maxdepth 1 -type d
                else
                  echo "$FW"
                fi
              done
            } | dybest_foerst > "$RUNNER_TEMP/bundter.txt"
            while IFS= read -r B; do
              [ -n "$B" ] || continue
              signer "$B"
            done < "$RUNNER_TEMP/bundter.txt"

            echo
            echo "== 3. selve appen =="
            APP_ENT="$ENT_DIR/app.plist"
            if codesign -d --entitlements :- "$APP" > "$APP_ENT" 2>/dev/null \
               && [ -s "$APP_ENT" ] && plutil -lint "$APP_ENT" > /dev/null 2>&1; then
              echo "   rettighederne er hentet ud af Xcodes egen signatur"
            else
              XCENT="$(find "$RUNNER_TEMP/dd/Build/Intermediates.noindex" -name "${PROJECT_NAME}.app.xcent" 2>/dev/null | head -n 1)"
              if [ -n "${XCENT:-}" ]; then
                cp "$XCENT" "$APP_ENT"
                echo "   rettighederne er hentet fra Xcodes mellemregning ($XCENT)"
              else
                rm -f "$APP_ENT"
                echo "   ADVARSEL: ingen rettigheder fundet — appen signeres uden"
              fi
            fi
            if [ -f "$APP_ENT" ]; then
              echo "   --- appens rettigheder ---"
              sed 's/^/       /' "$APP_ENT"
              codesign --force --sign - --timestamp=none --options runtime \
                       --entitlements "$APP_ENT" "$APP" 2>&1 || FEJL=$((FEJL + 1))
            else
              codesign --force --sign - --timestamp=none --options runtime "$APP" 2>&1 || FEJL=$((FEJL + 1))
            fi
            echo "   appen er signeret ($FEJL signeringsfejl indtil nu)"

            echo
            echo "== 4. codesign --verify --deep --strict =="
            if codesign --verify --deep --strict --verbose=2 "$APP" 2>&1; then
              VERIFIKATION=OK
            else
              VERIFIKATION=FEJLEDE
            fi
            echo "   resultat: $VERIFIKATION"

            echo
            echo "== 5. team-id på hver eneste del (skal stå «not set») =="
            tjek_team() {
              T_STI="$1"
              T_UD="$(codesign -dvv "$T_STI" 2>&1)"
              T_LINJE="$(printf '%s\n' "$T_UD" | grep -E '^TeamIdentifier=' | head -n 1)"
              T_CD="$(printf '%s\n' "$T_UD" | grep -E '^CodeDirectory ' | head -n 1)"
              [ -n "$T_LINJE" ] || T_LINJE="TeamIdentifier=(ingen linje — usigneret?)"
              if [ "$T_LINJE" = "TeamIdentifier=not set" ]; then
                echo "   OK   $(kort "$T_STI")  ->  $T_LINJE"
              else
                echo "   FEJL $(kort "$T_STI")  ->  $T_LINJE"
                MED_TEAM=$((MED_TEAM + 1))
              fi
              echo "        $T_CD"
            }
            while IFS= read -r F; do
              er_macho "$F" || continue
              tjek_team "$F"
            done < "$RUNNER_TEMP/binaerer.txt"
            while IFS= read -r B; do
              [ -n "$B" ] || continue
              tjek_team "$B"
            done < "$RUNNER_TEMP/bundter.txt"
            tjek_team "$APP"

            echo
            echo "== 6. de tre, Lauritz' fejlbesked handlede om =="
            for N in \
              "$APP" \
              "$APP/Contents/Frameworks/MediaRemoteAdapter.framework/Versions/A/MediaRemoteAdapter" \
              "$APP/Contents/XPCServices/BoringNotchXPCHelper.xpc" ; do
              echo "--- $(kort "$N")"
              if [ -e "$N" ]; then
                codesign -dvv "$N" 2>&1 | grep -E '^(Identifier|Format|CodeDirectory|Signature|TeamIdentifier|Authority)' || true
              else
                echo "    findes ikke i dette byg"
              fi
            done

            echo
            if [ "$FEJL" -gt 0 ] || [ "$MED_TEAM" -gt 0 ]; then
              # Dette er præcis Lauritz' nedbrud. Sådan en app må aldrig udgives.
              echo "SIGNERINGEN ER IKKE I ORDEN: $FEJL signeringsfejl, $MED_TEAM dele med team-id, --verify: $VERIFIKATION"
              return 1
            fi
            if [ "$VERIFIKATION" != "OK" ]; then
              # Team-id'erne er rene, så appen starter efter alt at dømme. Vi udgiver den,
              # men lader bygget stå RØDT, så den skæve forsegling ikke bliver overset.
              echo "ADVARSEL: team-id'erne er i orden, men --verify --deep --strict fejlede."
              return 2
            fi
            echo "SIGNERINGEN ER I ORDEN: alt er ad hoc, ingen indlejret del har et team-id."
            return 0
          }

          if [ "${BYG_STATUS:-1}" != "0" ] || [ ! -d "$APP" ]; then
            echo "Intet at signere — bygget kom ikke igennem." | tee "$LOG"
            echo "SIGN_STATUS=sprunget" >> "$GITHUB_ENV"
            exit 0
          fi

          hovedet > "$LOG" 2>&1
          STATUS=$?
          cat "$LOG"
          echo "SIGN_STATUS=$STATUS" >> "$GITHUB_ENV"
          exit "$STATUS"

      - name: Pak appen (zip og dmg)
        if: always()
        run: |
          set -uo pipefail
          exec > >(tee "$RUNNER_TEMP/pak.log") 2>&1
          APP="$RUNNER_TEMP/dd/Build/Products/Release/${PROJECT_NAME}.app"
          NAVN="${PROJECT_NAME}-jarvis-${{ steps.sha.outputs.kort }}"
          if [ ! -d "$APP" ]; then
            echo "Ingen app at pakke (bygget fejlede)."
            echo "HAR_APP=nej" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "HAR_APP=ja" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/ud"

          echo "== signaturen =="
          codesign -dv --verbose=2 "$APP" 2>&1 | tail -n 20 || true

          # ditto, ikke zip: signaturen og symlinks skal med
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$RUNNER_TEMP/ud/${NAVN}.zip"

          # dmg med husets eget script — det kræver ingen certifikater
          VENV="$RUNNER_TEMP/venv"
          python3 -m venv "$VENV"
          # shellcheck disable=SC1091
          source "$VENV/bin/activate"
          python3 -m pip install --quiet --upgrade pip setuptools wheel || true
          if python3 -m pip install --quiet --require-hashes -r Configuration/dmg/requirements.txt; then
            chmod +x Configuration/dmg/create_dmg.sh
            ./Configuration/dmg/create_dmg.sh "$APP" "$RUNNER_TEMP/ud/${NAVN}.dmg" "boringNotch Jarvis" \
              || echo "dmg'en fejlede — der er stadig en zip."
          else
            echo "dmgbuild kunne ikke installeres — der er stadig en zip."
          fi
          ls -la "$RUNNER_TEMP/ud"

      - name: Læg appen op som artifact
        if: always() && env.HAR_APP == 'ja'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: boringNotch-jarvis-${{ steps.sha.outputs.kort }}
          path: ${{ runner.temp }}/ud/*
          retention-days: 30
          if-no-files-found: warn

      - name: Læg byggeloggen op som artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: byggelog-${{ steps.sha.outputs.kort }}
          path: ${{ runner.temp }}/build.log
          retention-days: 30
          if-no-files-found: warn

      # Et almindeligt downloadlink til Lauritz. Hvert GRØNT byg på grenen bliver en
      # GitHub Release, så .../releases/latest altid peger på den nyeste app med Jarvis-fanen.
      # Rødt byg = ingen release. Mislykkedes dmg'en, udgives zip'en alligevel, og
      # udgivelsesteksten siger at dmg'en mangler.
      - name: Udgiv en Release (kun når bygget er grønt)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KORT: ${{ steps.sha.outputs.kort }}
        run: |
          set -uo pipefail
          exec > >(tee "$RUNNER_TEMP/release.log") 2>&1

          if [ "${BYG_STATUS:-1}" != "0" ] || [ "${HAR_APP:-nej}" != "ja" ]; then
            echo "Bygget var ikke grønt — ingen udgivelse denne gang."
            exit 0
          fi
          # En app, hvor en indlejret del stadig bærer et fremmed team-id, starter ikke
          # på Lauritz' Mac (dyld afviser den) — den udgives aldrig (SIGN_STATUS=1).
          # SIGN_STATUS=2 er team-id'erne rene og appen kørbar; kun forseglingen så skæv
          # ud, så den udgives, men bygget står rødt til sidst.
          case "${SIGN_STATUS:-1}" in
            0|2) ;;
            *) echo "Signeringen var ikke i orden (SIGN_STATUS=${SIGN_STATUS:-ukendt}) — ingen udgivelse."
               exit 0 ;;
          esac

          UD="$RUNNER_TEMP/ud"
          NAVN="${PROJECT_NAME}-jarvis-${KORT}"
          ZIP="$UD/${NAVN}.zip"
          DMG="$UD/${NAVN}.dmg"

          TAG="jarvis-v$(date -u +%Y%m%d)-${KORT}"
          DATO="$(date -u '+%-d/%-m-%Y')"

          # Kørte samme commit igen samme dag, så findes tagget allerede: ryd det væk først,
          # så udgivelsen bliver skrevet forfra i stedet for at fejle.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Udgivelsen $TAG fandtes i forvejen — den erstattes."
            gh release delete "$TAG" --yes --cleanup-tag || true
          fi

          FORRIGE="$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)"
          NYT="$RUNNER_TEMP/nyt.txt"
          if [ -n "$FORRIGE" ] && git rev-parse -q --verify "refs/tags/${FORRIGE}" >/dev/null; then
            git log --no-merges --format='- %s' "refs/tags/${FORRIGE}..HEAD" \
              | sed 's/ *\[skip ci\]//' | head -n 30 > "$NYT"
          else
            git log --no-merges --format='- %s' -n 10 | sed 's/ *\[skip ci\]//' > "$NYT"
          fi
          [ -s "$NYT" ] || echo "- (ingen nye commits siden sidste udgivelse)" > "$NYT"

          VEDHAEFT=""
          [ -f "$ZIP" ] && VEDHAEFT="$VEDHAEFT $ZIP"
          if [ -f "$DMG" ]; then
            VEDHAEFT="$VEDHAEFT $DMG"
            DMG_LINJE="- **${NAVN}.dmg** — dobbeltklik og træk **boringNotch** over i **Programmer**."
          else
            DMG_LINJE="- **dmg'en mangler denne gang** (pakningen fejlede på byggemaskinen) — brug zip'en."
          fi

          BODY="$RUNNER_TEMP/body.md"
          {
            echo "boringNotch med Jarvis-fanen, bygget hos GitHub på en Mac."
            echo
            echo "- dato: ${DATO}"
            echo "- commit: \`${GITHUB_SHA}\`"
            echo "- gren: ${GITHUB_REF_NAME}"
            echo "- kørsel: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "## Hent"
            echo
            echo "$DMG_LINJE"
            echo "- **${NAVN}.zip** — pak ud og træk **boringNotch.app** til **/Programmer**. Virker altid."
            echo
            echo "**Første gang advarer macOS**, fordi appen er ad hoc-signeret (ingen Apple-udviklerkonto)."
            echo "Højreklik på appen → **Åbn** → **Åbn**, eller i Terminal:"
            echo
            echo '```bash'
            echo "xattr -dr com.apple.quarantine /Applications/boringNotch.app"
            echo '```'
            echo
            echo "Resten af trinnene (tilladelser, login, Jarvis-adressen) står i \`JARVIS-OPSKRIFT.md\`."
            echo
            echo "## Hvad er nyt"
            echo
            cat "$NYT"
          } > "$BODY"

          # shellcheck disable=SC2086
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "boringNotch med Jarvis — ${DATO}" \
            --notes-file "$BODY" \
            --latest \
            $VEDHAEFT

          echo "UDGIVELSE=$TAG" >> "$GITHUB_ENV"
          echo
          echo "== udgivelsen $TAG =="
          echo "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          echo "== vedhæftede filer =="
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name)  \(.size) bytes"'

      # Byggeloggen tilbage i repoet, så huset (uden GitHub-adgang) kan læse den med
      #   git fetch origin build-logs && git show origin/build-logs:build-logs/latest.md
      - name: Skriv byggeloggen til grenen build-logs
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KORT: ${{ steps.sha.outputs.kort }}
        run: |
          set -uo pipefail
          LOG="$RUNNER_TEMP/build.log"
          [ -f "$LOG" ] || echo "(ingen byggelog — jobbet nåede ikke at bygge)" > "$LOG"

          if [ "${BYG_STATUS:-1}" = "0" ]; then
            STATUS="GRØN — appen blev bygget"
          else
            STATUS="RØD — bygget fejlede (exit ${BYG_STATUS:-ukendt})"
          fi
          if [ "${HAR_APP:-nej}" = "ja" ]; then
            ARTIFACT="boringNotch-jarvis-${KORT} (zip, og dmg hvis den lykkedes)"
          else
            ARTIFACT="ingen — der kom ingen .app ud af bygget"
          fi
          case "${SIGN_STATUS:-}" in
            0)        SIGNERING="OK — alt ad hoc, ingen indlejret del har et team-id" ;;
            1)        SIGNERING="FEJL — en indlejret del er ikke ad hoc-signeret (appen ville ikke starte); INTET udgivet" ;;
            2)        SIGNERING="ADVARSEL — team-id'erne er rene, men --verify --deep --strict fejlede; appen er udgivet, bygget står rødt" ;;
            sprunget) SIGNERING="sprunget over — der kom ingen app ud af bygget" ;;
            *)        SIGNERING="ukendt — signeringstrinnet nåede ikke at køre" ;;
          esac
          if [ -n "${UDGIVELSE:-}" ]; then
            RELEASE="${UDGIVELSE} — ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${UDGIVELSE}"
          else
            RELEASE="ingen — der udgives kun ved grønt byg"
          fi

          MD="$RUNNER_TEMP/latest.md"
          {
            echo "# Seneste byg — $STATUS"
            echo
            echo "- dato: $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "- gren: ${GITHUB_REF_NAME}"
            echo "- sha: ${GITHUB_SHA}"
            echo "- kørsel: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- artifact: $ARTIFACT"
            echo "- signering: $SIGNERING"
            echo "- udgivelse: $RELEASE"
            echo
            echo '## Fejl og advarsler (de første 200 linjer)'
            echo
            echo '```'
            grep -E "(error|warning):" "$LOG" | head -n 200 || true
            echo '```'
            echo
            echo '## Signeringen (ad hoc) og team-id-tjekket'
            echo
            echo '```'
            if [ -f "$RUNNER_TEMP/signering.log" ]; then tail -n 250 "$RUNNER_TEMP/signering.log"; else echo "(signeringen nåede ikke at køre)"; fi
            echo '```'
            echo
            echo '## Pakningen (zip og dmg)'
            echo
            echo '```'
            if [ -f "$RUNNER_TEMP/pak.log" ]; then tail -n 40 "$RUNNER_TEMP/pak.log"; else echo "(pakningen nåede ikke at køre)"; fi
            echo '```'
            echo
            echo '## Udgivelsen (Release) og de vedhæftede filer'
            echo
            echo '```'
            if [ -f "$RUNNER_TEMP/release.log" ]; then cat "$RUNNER_TEMP/release.log"; else echo "(udgivelsen nåede ikke at køre)"; fi
            echo '```'
            echo
            echo '## Slutningen af loggen (sidste 80 linjer)'
            echo
            echo '```'
            tail -n 80 "$LOG"
            echo '```'
          } > "$MD"

          WORK="$RUNNER_TEMP/logrepo"
          rm -rf "$WORK"; mkdir -p "$WORK"; cd "$WORK"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin build-logs 2>/dev/null; then
            git checkout -q -B build-logs FETCH_HEAD
          else
            git checkout -q -B build-logs
          fi
          mkdir -p build-logs
          cp "$MD" build-logs/latest.md
          { grep -E "error:" "$LOG" || echo "(ingen error:-linjer)"; } > build-logs/fejl.txt
          tail -n 1500 "$LOG" > build-logs/byggelog-hale.txt
          git add -A build-logs
          git commit -q -m "Byggelog ${KORT}: ${STATUS}" || echo "(intet nyt at skrive)"
          git push -q origin build-logs
          echo "Byggeloggen står nu på grenen build-logs."

      # Til allersidst, så byggeloggen ovenfor altid når at blive skrevet først:
      # en app med en fremmed-signeret indmad er et RØDT byg, ikke et grønt.
      - name: Signeringen skal være i orden
        if: always()
        run: |
          set -uo pipefail
          case "${SIGN_STATUS:-}" in
            1) echo "RØDT: en indlejret binær bærer stadig et team-id, der ikke er husets."
               echo "Appen ville falde med «different Team IDs» på Lauritz' Mac. Intet er udgivet."
               echo "Se trinnet «Signér alle indlejrede dele ad hoc» og build-logs/latest.md."
               exit 1 ;;
            2) echo "RØDT: team-id'erne er rene, og appen ER udgivet, men codesign --verify --deep --strict fejlede."
               echo "Læs afsnit 4 i trinnet «Signér alle indlejrede dele ad hoc» før næste byg."
               exit 1 ;;
          esac
          echo "Signeringen er i orden (SIGN_STATUS=${SIGN_STATUS:-sprunget})."
